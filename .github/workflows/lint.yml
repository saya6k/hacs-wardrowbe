name: Lint

# Reusable: ruff lint. Called by ci.yml on every push/PR.
#
# Lint only — the pytest suite is not run here. It needs
# pytest-homeassistant-custom-component, which pins one exact Home Assistant
# release (2026.7.4 as of writing) while this integration targets 2026.8; the
# 2026.8-only tests skip themselves on that stack, so CI would report a green
# run that never exercised the LLM platform. Revisit once phacc ships a
# release tracking 2026.8 (see tests/requirements_test.txt).
# yamllint disable-line rule:truthy
on:
  workflow_call:

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Create the Python 3.14 environment
        run: uv venv --python 3.14

      - name: Install ruff
        run: uv pip install ruff

      # Call the venv binary directly — `uv run` would treat the repo as a
      # project and editable-install it, but this is a custom_components
      # layout, not a package.
      - name: Ruff
        run: .venv/bin/ruff check .
